services:
  kitt:
    build: .
    image: kitt-intel
    container_name: kitt-intel
    ports:
      - "5052:5052"
    volumes:
      # Feed JSON survives rebuilds and restarts
      - ./data:/app/data
      # Edit sources.yaml on your Mac; restart the container to pick it up
      - ./sources.yaml:/app/sources.yaml:ro
    restart: unless-stopped
