# Project name shown in Docker Desktop (Docker requires lowercase, no spaces)
name: kitt-threat-radar

services:
  kitt:
    build: .
    image: kitt-threat-radar
    container_name: kitt-threat-radar
    ports:
      - "5052:5052"
    volumes:
      # Feed JSON survives rebuilds and restarts
      - ./data:/app/data
      # Edit sources.yaml on your Mac; restart the container to pick it up
      - ./sources.yaml:/app/sources.yaml:ro
      # IOC ignore list: edit it here, or use the Ignore buttons in the dashboard
      - ./ioc_ignore.yaml:/app/ioc_ignore.yaml
    environment:
      # Hide and drop articles older than this many days
      - MAX_AGE_DAYS=30
    restart: unless-stopped
