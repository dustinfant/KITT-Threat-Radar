# ===========================================
# KITT IOC ignore list
# ===========================================
# Indicators listed here are hidden everywhere: dashboard, radar, Discover,
# Investigate and both exports. Changes apply within a minute, no restart needed.
#
# Always ignored automatically (no need to list them):
#   - private, loopback, link-local, multicast and reserved IPs
#     (10.x, 192.168.x, 127.0.0.1, 0.0.0.0, documentation ranges, ...)
#   - the article's own website

# Domains: each entry also covers all of its subdomains
# (github.com also hides gist.github.com). Also applies to emails at these domains.
# Reference sites, social media and the feed publishers themselves.
